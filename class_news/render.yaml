services:
  - type: web
    name: class-news
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: class-news-data
      mountPath: /var/data
      sizeGB: 1
