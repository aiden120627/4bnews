<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리반 뉴스 관리자</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar"><div class="wrap bar-inner"><a class="logo" href="/">📰 우리반 뉴스</a><a class="admin-link" href="/">홈</a></div></header>
  <main class="wrap admin-wrap">
    <section id="loginBox" class="card narrow">
      <h1>관리자 로그인</h1>
      <p class="muted">뉴스를 등록하려면 관리자 키를 입력하세요.</p>
      <input id="adminKey" type="password" placeholder="관리자 키">
      <button id="loginBtn" class="primary">로그인</button>
      <p id="loginMsg" class="message"></p>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="admin-head"><div><h1>뉴스 관리</h1><p class="muted">뉴스 등록, 수정, 삭제를 관리합니다.</p></div><button id="newBtn" class="secondary">+ 새 뉴스</button></div>
      <section class="card">
        <form id="newsForm">
          <input type="hidden" id="editingId">
          <label>제목</label>
          <input id="title" required placeholder="뉴스 제목">
          <label>내용</label>
          <textarea id="content" rows="9" required placeholder="뉴스 내용을 입력하세요."></textarea>
          <label>이미지</label>
          <input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
          <label class="check"><input id="removeImage" type="checkbox"> 기존 이미지 삭제</label>
          <div class="form-actions"><button type="submit" class="primary">저장</button><button type="button" id="cancelBtn" class="secondary">취소</button></div>
          <p id="formMsg" class="message"></p>
        </form>
      </section>
      <section id="adminNewsList" class="news-list"></section>
    </section>
  </main>
  <script src="/static/admin.js"></script>
</body>
</html>
